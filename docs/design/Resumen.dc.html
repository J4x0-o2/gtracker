<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entreno terminado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#070B12}
a{color:#7CCBFF;text-decoration:none}a:hover{color:#B5E2FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #070B12; color: #E6EDF7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 28px 16px 18px; overflow: hidden">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
    <span style="width: 64px; height: 64px; border-radius: 999px; border: 2px solid #38B6FF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 28px rgba(56,182,255,0.5)">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#38B6FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
    </span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700">Rutina B completada</h1>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #B5C3D6">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #38B6FF; box-shadow: 0 0 8px #38B6FF"></span>
      Todo enviado al Sheet
    </span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #0D141F; border: 1px solid #1A2433">
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700">9</span>
      <span style="font-size: 12px; color: #8A9AB2">Ejercicios</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #0D141F; border: 1px solid #1A2433">
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700">16</span>
      <span style="font-size: 12px; color: #8A9AB2">Series</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 14px; background: #0D141F; border: 1px solid #1A2433">
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700">2</span>
      <span style="font-size: 12px; color: #8A9AB2">Récords</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #38B6FF">RÉCORDS DE HOY</span>
    <sc-for list="{{prs}}" as="p" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 14px; background: #0D1A2A; border: 1px solid #1E4466">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38B6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6 4 4 6-8"></path><path d="M14 7h6v6"></path></svg>
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
          <span style="font-size: 12px; color: #8A9AB2">{{p.detail}}</span>
        </span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 15px; font-weight: 700; color: #7CCBFF">{{p.delta}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: #0D141F; border: 1px solid #1A2433">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8A9AB2">PRÓXIMO ENTRENO · RUTINA A</span>
    <sc-for list="{{nextA}}" as="n" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 22px; font-size: 13px; color: #8A9AB2">{{n.i}}</span>
        <span style="font-size: 14px; flex-grow: 1">{{n.name}}</span>
        <span style="font-size: 11px; color: #8A9AB2; padding: 2px 8px; border-radius: 999px; border: 1px solid #1C2738">{{n.group}}</span>
      </div>
    </sc-for>
    <span style="font-size: 12px; color: #8A9AB2">+ 5 más</span>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #38B6FF; color: #04111D; font-size: 16px; font-weight: 700; box-shadow: 0 0 24px rgba(56,182,255,0.5)">Listo</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      prs: [
        { name: 'Abductor', detail: '45 kg × 8 · RIR 1', delta: '+2.4' },
        { name: 'Remo T', detail: '50 kg × 9 · RIR 1', delta: '+1.7' }
      ],
      nextA: [
        { i: '1', name: 'Tricep extension', group: 'Brazo' },
        { i: '2', name: 'Predicador curl uni', group: 'Brazo' },
        { i: '3', name: 'Squat Smith', group: 'Pierna' },
        { i: '4', name: 'Hamstring curl sentado', group: 'Pierna' }
      ]
    };
  }
}
</script>
</body>
</html>
