<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cambiar ejercicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#070B12}
a{color:#7CCBFF;text-decoration:none}a:hover{color:#B5E2FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #04070C; color: #E6EDF7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

  <div style="flex-grow: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; opacity: 0.35">
    <span style="font-size: 13px; color: #8A9AB2">Rutina A · 7 de 9</span>
    <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; font-weight: 700">Lateral polea</span>
  </div>

  <div role="dialog" aria-label="Cambiar ejercicio" style="display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 24px; border-radius: 24px 24px 0 0; background: #0D141F; border-top: 1px solid #38B6FF; box-shadow: 0 -10px 40px rgba(56,182,255,0.18)">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #2A374A"></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">Cambiar Lateral polea</h2>
      <span style="font-size: 13px; color: #8A9AB2">¿La máquina está ocupada? Elige una alternativa del mismo grupo.</span>
    </div>

    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #38B6FF">ALTERNATIVAS · HOMBRO</span>
    <sc-for list="{{alts}}" as="a" hint-placeholder-count="1">
      <button type="button" onClick="{{a.pick}}" style="{{a.style}}">
        <span style="display: flex; flex-direction: column; gap: 2px; align-items: flex-start; flex-grow: 1">
          <span style="font-size: 15px; font-weight: 600; color: #E6EDF7">{{a.name}}</span>
          <span style="font-size: 12px; color: #8A9AB2">{{a.last}}</span>
        </span>
        <sc-if value="{{a.selected}}" hint-placeholder-val="{{false}}">
          <span style="width: 24px; height: 24px; border-radius: 999px; background: #38B6FF; display: flex; align-items: center; justify-content: center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#04111D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          </span>
        </sc-if>
      </button>
    </sc-for>

    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8A9AB2">O SALTA A OTRO DE LA RUTINA</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <a href="Ejercicio.dc.html" style="font-size: 13px; padding: 10px 14px; border-radius: 12px; border: 1px solid #1C2738; color: #E6EDF7">Abs machine</a>
      <a href="Ejercicio.dc.html" style="font-size: 13px; padding: 10px 14px; border-radius: 12px; border: 1px solid #1C2738; color: #E6EDF7">Pulldown</a>
      <a href="Ejercicio.dc.html" style="font-size: 13px; padding: 10px 14px; border-radius: 12px; border: 1px solid #1C2738; color: #E6EDF7">Banca</a>
    </div>

    <a href="Ejercicio.dc.html" style="margin-top: 6px; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #38B6FF; color: #04111D; font-size: 16px; font-weight: 700; box-shadow: 0 0 24px rgba(56,182,255,0.5)">Usar {{selectedName}}</a>
    <a href="Ejercicio.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 14px">Cancelar</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  renderVals() {
    var self = this;
    var list = [
      ['Lateral raises', 'Mancuerna · Última: 12.5 kg · 8, 5 reps (11/11)'],
      ['Lateral polea', 'Polea · Última: 2 placas · 6, 6 reps (31/10)']
    ];
    var alts = list.map(function (x, i) {
      var sel = self.state.picked === i;
      return {
        name: x[0],
        last: x[1],
        selected: sel,
        pick: function () { self.setState({ picked: i }); },
        style: 'display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; font-family: inherit; text-align: left; cursor: pointer; background: ' + (sel ? '#0D1A2A; border: 1px solid #38B6FF; box-shadow: 0 0 14px rgba(56,182,255,0.25);' : '#0A111B; border: 1px solid #1A2433;')
      };
    });
    return { alts: alts, selectedName: list[this.state.picked][0] };
  }
}
</script>
</body>
</html>
