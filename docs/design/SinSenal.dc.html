<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sin señal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#070B12}
a{color:#7CCBFF;text-decoration:none}a:hover{color:#B5E2FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #070B12; color: #E6EDF7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 20px 16px 18px; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 14px; color: #8A9AB2">Jueves 12 nov</span>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #FFD08A; padding: 6px 12px; border: 1px solid #4A3A1C; border-radius: 999px; background: #17120A">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.1-1.5M12 20h.01"></path></svg>
      Sin señal · 3 por enviar
    </span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: #0D141F; border: 1px solid #1A2433">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; border: 1px solid #4A3A1C; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Guardado en el teléfono</span>
        <span style="font-size: 13px; color: #8A9AB2">Se envía solo al Sheet cuando vuelva la conexión.</span>
      </span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8A9AB2">EN COLA</span>
    <sc-for list="{{queue}}" as="q" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 14px; background: #0D141F; border: 1px solid #1A2433">
        <span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 999px; background: #FFB547"></span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <span style="font-size: 15px; font-weight: 600">{{q.name}}</span>
          <span style="font-size: 12px; color: #8A9AB2">{{q.detail}}</span>
        </span>
        <span style="font-size: 12px; color: #8A9AB2">{{q.time}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8A9AB2">YA EN EL SHEET</span>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border-radius: 14px; border: 1px solid #1A2433">
      <span style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 999px; background: #38B6FF; box-shadow: 0 0 8px #38B6FF"></span>
      <span style="font-size: 14px; color: #B5C3D6; flex-grow: 1">Tras nuca, Incline curl, Cuádriceps ext.</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <button type="button" style="height: 52px; border-radius: 16px; border: 1px solid #38B6FF; background: none; color: #7CCBFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Reintentar envío ahora</button>
  <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #38B6FF; color: #04111D; font-size: 16px; font-weight: 700; box-shadow: 0 0 24px rgba(56,182,255,0.5)">Seguir entrenando</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      queue: [
        { name: 'Hamstring curl sentado', detail: '13 placas · 2 series', time: '7:42 p. m.' },
        { name: 'Abs machine', detail: '20 kg · 1 serie', time: '7:49 p. m.' },
        { name: 'Abductor', detail: '45 kg · 2 series', time: '7:58 p. m.' }
      ]
    };
  }
}
</script>
</body>
</html>
