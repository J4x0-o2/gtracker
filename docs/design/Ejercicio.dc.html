<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registrar ejercicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#070B12}
a{color:#7CCBFF;text-decoration:none}a:hover{color:#B5E2FF}
input::placeholder{color:#7A8BA3;opacity:1}
input:focus{outline:none;border-color:#38B6FF !important;box-shadow:0 0 0 3px rgba(56,182,255,0.25),0 0 14px rgba(56,182,255,0.35)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button:disabled{cursor:not-allowed}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #070B12; color: #E6EDF7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 16px 16px 18px; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Main.dc.html" aria-label="Volver a la rutina" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid #1C2738; background: #0D141F">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5C3D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 13px; color: #8A9AB2">Rutina B · 5 de 9</span>
    <a href="Cambiar.dc.html" aria-label="Cambiar por ejercicio alternativo" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid #1C2738; background: #0D141F">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B5C3D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"></path></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; font-weight: 700; line-height: 1.1">Abs machine</h1>
    <div style="display: flex; gap: 8px">
      <span style="font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #1C2738; color: #B5C3D6">Abdomen</span>
      <span style="font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #1C2738; color: #B5C3D6">kg</span>
      <span style="font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #1E4466; color: #7CCBFF">Récord 1RM est. 30.8</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-height: 0">
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="1">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: #0D141F; border: 1px solid #1A2433">
        <div style="display: flex; align-items: center; justify-content: space-between; height: 28px">
          <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #38B6FF">SERIE {{s.n}}</span>
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 12px; color: #8A9AB2">{{s.hint}}</span>
            <sc-if value="{{s.removable}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{s.remove}}" aria-label="Quitar serie" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #1C2738; background: none; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9AB2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </sc-if>
          </span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8A9AB2">
            Peso
            <input type="number" inputmode="decimal" placeholder="{{s.w}}" style="height: 56px; width: 100%; box-sizing: border-box; border-radius: 14px; border: 1px solid #22304A; background: #070B12; color: #FFFFFF; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600; text-align: center">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8A9AB2">
            Reps
            <input type="number" inputmode="numeric" placeholder="{{s.r}}" style="height: 56px; width: 100%; box-sizing: border-box; border-radius: 14px; border: 1px solid #22304A; background: #070B12; color: #FFFFFF; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600; text-align: center">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #8A9AB2">
            RIR
            <input type="number" inputmode="numeric" placeholder="{{s.rir}}" style="height: 56px; width: 100%; box-sizing: border-box; border-radius: 14px; border: 1px solid #22304A; background: #070B12; color: #FFFFFF; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 600; text-align: center">
          </label>
        </div>
      </div>
    </sc-for>

    <button type="button" onClick="{{addSet}}" disabled="{{full}}" style="{{addStyle}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      {{addLabel}}
    </button>
  </div>

  <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div role="status" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; border: 1px solid #38B6FF; background: #0D1A2A; box-shadow: 0 0 18px rgba(56,182,255,0.3)">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: #38B6FF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#04111D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600">Enviado al Sheet</span>
          <span style="font-size: 12px; color: #8A9AB2">{{sentLabel}}</span>
        </span>
      </div>
      <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #38B6FF; color: #04111D; font-size: 16px; font-weight: 700; box-shadow: 0 0 24px rgba(56,182,255,0.5)">Sugerido: Abductor</a>
    </div>
  </sc-if>
  <sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
    <button type="button" onClick="{{finish}}" style="height: 56px; border-radius: 16px; border: none; background: #38B6FF; color: #04111D; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 0 24px rgba(56,182,255,0.5)">Terminar ejercicio</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { count: 1, sent: false };
  }
  renderVals() {
    var self = this;
    var last = [{ w: '20', r: '7', rir: '0' }];
    var count = this.state.count;
    var sets = [];
    for (var i = 0; i < count; i++) {
      var p = last[i] || last[last.length - 1];
      sets.push({
        n: String(i + 1),
        w: p.w, r: p.r, rir: p.rir,
        hint: last[i] ? 'Última vez · 09/11' : 'Sin dato previo',
        removable: count > 1 && i === count - 1,
        remove: function () { self.setState({ count: Math.max(1, self.state.count - 1) }); }
      });
    }
    var full = count >= 3;
    var addStyle = 'height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; font-family: inherit; font-size: 15px; font-weight: 600; background: none; ' + (full
      ? 'border: 1px dashed #1C2738; color: #4A5A70;'
      : 'border: 1px dashed #38B6FF; color: #7CCBFF; cursor: pointer;');
    return {
      sets: sets,
      full: full,
      addStyle: addStyle,
      addLabel: full ? 'Máximo 3 series' : 'Agregar serie (' + count + '/3)',
      addSet: function () { if (self.state.count < 3) self.setState({ count: self.state.count + 1 }); },
      finish: function () { self.setState({ sent: true }); },
      sent: this.state.sent,
      notSent: !this.state.sent,
      sentLabel: count + (count === 1 ? ' serie guardada' : ' series guardadas') + ' · ahora mismo'
    };
  }
}
</script>
</body>
</html>
