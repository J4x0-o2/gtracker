<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hoy toca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#070B12}
a{color:#7CCBFF;text-decoration:none}a:hover{color:#B5E2FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #070B12; color: #E6EDF7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 18px; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 14px; color: #8A9AB2">Jueves 12 nov</span>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #B5C3D6; padding: 6px 12px; border: 1px solid #1C2738; border-radius: 999px; background: #0D141F">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #38B6FF; box-shadow: 0 0 8px #38B6FF"></span>
      Sincronizado
    </span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #38B6FF">HOY TOCA</span>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 40px; font-weight: 700; line-height: 1; text-shadow: 0 0 22px rgba(56,182,255,0.45)">Rutina B</h1>
      <span style="font-size: 14px; color: #8A9AB2">4 / 9 hechos</span>
    </div>
    <div style="margin-top: 6px; height: 6px; border-radius: 999px; background: #131C29; overflow: hidden">
      <div style="width: 44%; height: 6px; border-radius: 999px; background: #38B6FF; box-shadow: 0 0 12px #38B6FF"></div>
    </div>
    <span style="font-size: 12px; color: #8A9AB2">Toca cualquier ejercicio para empezarlo · máx. 2 seguidos del mismo grupo</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
      <sc-if value="{{it.blocked}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 50px; box-sizing: border-box; padding: 7px 12px; border-radius: 14px; background: #0B1019; border: 1px dashed #3A3324">
          <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 999px; border: 1px solid #3A3324; display: flex; align-items: center; justify-content: center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-size: 15px; font-weight: 600; color: #8A9AB2">{{it.name}}</span>
            <span style="font-size: 12px; color: #FFB547">Pierna ×2 seguidas · haz otro grupo antes</span>
          </span>
          <span style="font-size: 11px; color: #8A9AB2; padding: 3px 8px; border-radius: 999px; border: 1px solid #1C2738">{{it.group}}</span>
        </div>
      </sc-if>
      <sc-if value="{{it.open}}" hint-placeholder-val="{{true}}">
        <a href="Ejercicio.dc.html" style="{{it.rowStyle}}">
          <sc-if value="{{it.done}}" hint-placeholder-val="{{false}}">
            <span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 999px; background: #38B6FF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(56,182,255,0.6)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#04111D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
            </span>
          </sc-if>
          <sc-if value="{{it.pending}}" hint-placeholder-val="{{true}}">
            <span style="{{it.dotStyle}}">{{it.n}}</span>
          </sc-if>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-size: 15px; font-weight: 600; color: {{it.nameColor}}">{{it.name}}</span>
            <span style="font-size: 12px; color: {{it.lastColor}}">{{it.last}}</span>
          </span>
          <span style="font-size: 11px; color: #8A9AB2; padding: 3px 8px; border-radius: 999px; border: 1px solid #1C2738">{{it.group}}</span>
        </a>
      </sc-if>
    </sc-for>
  </div>

  <a href="Ejercicio.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; flex-shrink: 0; border-radius: 16px; background: #38B6FF; color: #04111D; font-size: 16px; font-weight: 700; box-shadow: 0 0 24px rgba(56,182,255,0.5)">
    Sugerido: Abs machine
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#04111D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['Tras nuca', 'Brazo', '3 placas · 8, 7, 6 reps', 'done'],
      ['Incline curl', 'Brazo', '15 kg · 7, 5 reps', 'done'],
      ['Cuádriceps extension', 'Pierna', '18 placas · 8, 8 reps', 'done'],
      ['Hamstring curl sentado', 'Pierna', '13 placas · 10, 8 reps', 'done'],
      ['Abs machine', 'Abdomen', '20 kg · 7 reps', 'next'],
      ['Abductor', 'Pierna', '40 kg · 7, 8 reps', 'blocked'],
      ['Military press machine', 'Hombro', '40 kg · 8, 6 reps', 'todo'],
      ['Remo T', 'Espalda', '45–50 kg · 8, 7 reps', 'todo'],
      ['Pec deck', 'Pecho', '13 placas · 9 reps', 'todo']
    ];
    var base = 'display: flex; align-items: center; gap: 12px; min-height: 50px; box-sizing: border-box; padding: 7px 12px; border-radius: 14px; ';
    var items = list.map(function (x, i) {
      var st = x[3];
      var done = st === 'done';
      var next = st === 'next';
      return {
        n: String(i + 1),
        name: x[0],
        group: x[1],
        last: done ? 'Registrado hoy' : (next ? 'Sugerido · Última: ' + x[2] : 'Última: ' + x[2]),
        lastColor: next ? '#7CCBFF' : '#8A9AB2',
        done: done,
        pending: !done,
        blocked: st === 'blocked',
        open: st !== 'blocked',
        nameColor: done ? '#8A9AB2' : '#E6EDF7',
        rowStyle: base + (next
          ? 'background: #0D1A2A; border: 1px solid #38B6FF; box-shadow: 0 0 16px rgba(56,182,255,0.28);'
          : 'background: #0D141F; border: 1px solid #1A2433;'),
        dotStyle: 'width: 28px; height: 28px; flex-shrink: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; box-sizing: border-box; ' + (next
          ? 'border: 2px solid #38B6FF; color: #38B6FF;'
          : 'border: 1px solid #2A374A; color: #8A9AB2;')
      };
    });
    return { items: items };
  }
}
</script>
</body>
</html>
